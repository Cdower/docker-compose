name: hindsight
# Hindsight agent-memory stack — https://hindsight.vectorize.io
#
# Based on the upstream "external PostgreSQL" + "custom-models" / "local-llm"
# examples: https://github.com/vectorize-io/hindsight/tree/main/docker/docker-compose
#
# This stack runs:
#   - db        : a dedicated PostgreSQL + pgvector container (Postgres lives in
#                 its own container, external to the Hindsight process — not the
#                 embedded pg0). Swap to a fully managed/remote Postgres by
#                 setting HINDSIGHT_API_DATABASE_URL in .env (see below).
#   - hindsight : the full Hindsight image. The `:latest` (full) image bakes in
#                 the default LOCAL embedding + reranker models
#                 (BAAI/bge-small-en-v1.5 and cross-encoder/ms-marco-MiniLM-L-6-v2),
#                 so embeddings/reranking run locally with no extra config.
#   - llama     : OPTIONAL local-LLM sidecar (llama.cpp, OpenAI-compatible).
#                 Disabled by default; enable with `--profile local-llm`.
#
# The LLM defaults to a hosted, OpenAI-compatible provider (OpenRouter), with
# ready-to-use blocks for NVIDIA NIM, Google Gemini, Groq and a local model in
# .env.example. Embeddings + reranking stay local by default (defaults are fine).
#
# Quick start:
#   cp .env.example .env      # then edit .env (set your LLM API key + DB password)
#   docker compose up -d
#
#   API:           http://localhost:8888
#   Control Plane: http://localhost:9999

services:
  db:
    # PostgreSQL with the pgvector extension pre-installed.
    # https://hub.docker.com/r/pgvector/pgvector
    image: pgvector/pgvector:pg${HINDSIGHT_DB_VERSION:-18}
    container_name: hindsight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight_user}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in hindsight/.env (copy from .env.example)}
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight_db}
    volumes:
      - pg_data:/var/lib/postgresql/${HINDSIGHT_DB_VERSION:-18}/docker
    # Uncomment to reach Postgres from the host (e.g. psql / backups).
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HINDSIGHT_DB_USER:-hindsight_user} -d ${HINDSIGHT_DB_NAME:-hindsight_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hindsight-net

  hindsight:
    # Full image (NOT -slim): bundles the default local embedding + reranker
    # models so no models are downloaded at runtime.
    image: ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION:-latest}
    container_name: hindsight-app
    restart: unless-stopped
    ports:
      - "8888:8888"  # API
      - "9999:9999"  # Control Plane UI
    # All LLM / provider settings come from .env (see .env.example). The two
    # entries below are kept here so the bundled DB "just works" and so a
    # missing LLM key / DB password fails fast with a clear message.
    env_file:
      - path: .env
        required: false
    environment:
      # Required for every hosted provider (OpenRouter, NVIDIA, Google, Groq).
      # For the local-llm profile any non-empty value works (e.g. not-needed).
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?set HINDSIGHT_API_LLM_API_KEY in hindsight/.env (copy from .env.example)}
      # Defaults to the bundled `db` service. To use a fully external/managed
      # PostgreSQL, set HINDSIGHT_API_DATABASE_URL in .env (it wins over this
      # default) and stop running the `db` service (see README).
      HINDSIGHT_API_DATABASE_URL: ${HINDSIGHT_API_DATABASE_URL:-postgresql://${HINDSIGHT_DB_USER:-hindsight_user}:${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in hindsight/.env}@db:5432/${HINDSIGHT_DB_NAME:-hindsight_db}}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hindsight-net

  # ---------------------------------------------------------------------------
  # Optional: fully-local LLM via a llama.cpp sidecar (OpenAI-compatible).
  # Disabled by default. Enable with:  docker compose --profile local-llm up -d
  # Then point Hindsight at it in .env (see the "Local model" block there):
  #   HINDSIGHT_API_LLM_PROVIDER=openai
  #   HINDSIGHT_API_LLM_BASE_URL=http://llama:8080/v1
  #   HINDSIGHT_API_LLM_API_KEY=not-needed
  #   HINDSIGHT_API_LLM_MODEL=gemma-4-e2b-it
  # First boot downloads the GGUF (~3.5 GB) into the llama_models volume.
  # ---------------------------------------------------------------------------
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: hindsight-llama
    restart: unless-stopped
    profiles: ["local-llm"]
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_HF_REPO: ${LLAMA_HF_REPO:-bartowski/google_gemma-4-E2B-it-GGUF}
      LLAMA_ARG_HF_FILE: ${LLAMA_HF_FILE:-google_gemma-4-E2B-it-Q4_K_M.gguf}
      LLAMA_ARG_CTX_SIZE: "8192"
      # NVIDIA GPU: switch image to ghcr.io/ggml-org/llama.cpp:server-cuda,
      # uncomment the next line and the deploy block below.
      # LLAMA_ARG_N_GPU_LAYERS: "999"
    volumes:
      - llama_models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - hindsight-net
    # NVIDIA GPU acceleration (requires the NVIDIA Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  hindsight-net:
    driver: bridge

volumes:
  pg_data:
  llama_models:
