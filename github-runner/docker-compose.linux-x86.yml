name: github-runner
# GitHub Actions self-hosted runner — Linux x86 host (Ubuntu Server 26.04).
#
# Runs as a linux/amd64 container. The *token source* here is the system Secret
# Service (libsecret / gnome-keyring) — Ubuntu's device keychain — read with the
# `secret-tool` CLI from the `libsecret-tools` package.
#
# The registration token is NEVER written to disk or committed. It is read from
# the keychain at start time and injected as RUNNER_TOKEN. Use the wrapper so the
# lookup happens for you:
#
#   ./scripts/store-token-linux.sh     # one-time: stash the token in the keychain
#   ./scripts/runner-up-linux.sh       # reads keychain -> RUNNER_TOKEN -> compose up
#
# …which is exactly equivalent to:
#
#   RUNNER_TOKEN="$(secret-tool lookup service github-actions-runner-token \
#       account "$USER")" \
#     docker compose -f docker-compose.linux-x86.yml up -d --build
#
# The token is handed to the container as a Docker *secret* (mounted at
# /run/secrets/runner_token, not in the environment / `docker inspect`), sourced
# from the RUNNER_TOKEN env var the wrapper exports. All non-secret settings
# (URL, name, labels, …) live in .env — see .env.example.

# Fail fast at `compose up` time (not just inside the container) if the keychain
# lookup produced nothing. This `x-` key is ignored by the schema; it exists only
# so the interpolation guard below runs.
x-require-token: ${RUNNER_TOKEN:?RUNNER_TOKEN is empty — start with ./scripts/runner-up-linux.sh so the token is read from the keychain (run ./scripts/store-token-linux.sh first if you have not)}

services:
  runner:
    build:
      context: .
      args:
        RUNNER_VERSION: ${RUNNER_VERSION:-latest}
    image: github-actions-runner:amd64
    platform: linux/amd64
    container_name: github-runner
    restart: unless-stopped
    # Give an in-flight job time to finish on `docker compose down` / `stop`.
    stop_grace_period: 5m
    env_file:
      - path: .env
        required: false
    environment:
      # Non-secret config only (the token arrives via `secrets:` below, never the
      # environment). Falls back to these defaults if unset in .env.
      RUNNER_URL: ${RUNNER_URL:?set RUNNER_URL in github-runner/.env (e.g. https://github.com/<org>/<repo>)}
      RUNNER_NAME: ${RUNNER_NAME:-}
      # The `docker` label is opt-in: it's added by
      # docker-compose.linux-x86.override.yml together with the host Docker
      # socket mount (docker-in-job). See the README.
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,linux,x64}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-_work}
      RUNNER_EXTRA_ARGS: ${RUNNER_EXTRA_ARGS:-}
      # Where config.sh output + _work are persisted *inside* the container; this
      # path is the mount point of the volume below.
      RUNNER_DIR: /runner
      TZ: 'America/Los_Angeles'
    secrets:
      # Mounted at /run/secrets/runner_token; the entrypoint reads it there.
      - runner_token
    volumes:
      # config.sh writes .runner/.credentials/.credentials_rsaparams/_diag here,
      # plus the _work checkout dir. The named volume persists them across restarts
      # and image rebuilds, so the runner registers only once.
      - runner-data:/runner
      # Prefer a path on local disk instead of a Docker volume? Comment the line
      # above and use a bind mount (created automatically), e.g.:
      # - ./_data/runner:/runner
      # Docker-in-job (mounting the host Docker socket) is opt-in and lives in
      # docker-compose.linux-x86.override.yml. Turn it on with
      # RUNNER_DOCKER_IN_JOB=1 ./scripts/runner-up-linux.sh — see the README.
    healthcheck:
      # The runner has no port; treat "Runner.Listener is alive" as healthy.
      test: ["CMD-SHELL", "pgrep -f Runner.Listener >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

secrets:
  # The token is read from the RUNNER_TOKEN env var (exported from the keychain by
  # scripts/runner-up-linux.sh) and exposed to the container as a file under
  # /run/secrets — keeping it out of the container environment / `docker inspect`.
  runner_token:
    environment: RUNNER_TOKEN

volumes:
  runner-data:
